<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vương Triều Họ Đỗ - Hành Trình Lập Nghiệp Tại Rạch Giá, Kiên Giang</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2b1d0c;
            --primary-light: #52381b;
            --accent: #c5a059;
            --cream: #fdfbf7;
            --dark: #212529;
            --light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--dark);
            background-color: var(--cream);
            line-height: 1.8;
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Header */
        header {
            background: rgba(43, 29, 12, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 30px;
            opacity: 0.9;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 14px 36px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #dfbc77;
        }

        /* Story Section */
        .story {
            padding: 120px 20px;
            background: white;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .section-subtitle {
            text-align: center;
            color: #777;
            font-size: 18px;
            margin-bottom: 70px;
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .story-text h3 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .story-text p {
            margin-bottom: 20px;
            color: #444;
            font-size: 17px;
        }

        .story-img {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        .story-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Milestone / Stats */
        .milestones {
            padding: 80px 20px;
            background: var(--primary);
            color: white;
            text-align: center;
        }

        .milestone-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        .milestone-item i {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .milestone-item h4 {
            font-size: 36px;
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .milestone-item p {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Inspiration Quote */
        .inspiration {
            padding: 100px 20px;
            background: #f4eee1;
            text-align: center;
        }

        .inspiration-box {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .inspiration-box i {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .inspiration-box p {
            font-size: 20px;
            font-style: italic;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .inspiration-box span {
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        /* Footer */
        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        footer p {
            opacity: 0.8;
            font-size: 14px;
        }
